services:
  gps-worker:
    build: .
    image: gps-emulator
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./output:/app/output
    restart: "no"
    profiles:
      - worker

  gps-scheduler:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    entrypoint: /bin/sh
    command: >
      -c "apk add --no-cache tzdata && cp /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime && echo 'America/Sao_Paulo' > /etc/timezone && cd /compose && docker compose run --rm gps-worker node src/log-schedule.js && if [ -n \"${CRON_SCHEDULE}\" ]; then printf '%s' \"${CRON_SCHEDULE}\" | grep -qE '^[0-9*/,\-]+ [0-9*/,\-]+ [0-9*/,\-]+ [0-9*/,\-]+ [0-9*/,\-]+$' || { echo 'Invalid CRON_SCHEDULE format'; exit 1; } && printf '%s\tcd /compose && docker compose run --rm gps-worker\n' \"${CRON_SCHEDULE}\" | crontab - && crond -f -l 2; else tail -f /dev/null; fi"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond || pgrep tail"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
